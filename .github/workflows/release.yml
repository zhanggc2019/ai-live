name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --no-frozen-lockfile

      - name: Verify tag
        run: node scripts/release-assets.js check-tag

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Package Windows installer
        if: matrix.platform == 'windows'
        run: pnpm run build

      - name: Verify Windows update assets
        if: matrix.platform == 'windows'
        run: node scripts/release-assets.js windows

      - name: Package and verify macOS installer
        if: matrix.platform == 'macos'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$CSC_LINK" ]]; then
            pnpm run build --config.forceCodeSigning=true
            node scripts/release-assets.js macos --signed
          else
            CSC_IDENTITY_AUTO_DISCOVERY=false pnpm run build --mac dmg --universal
            node scripts/release-assets.js macos
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/assets/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release/assets
          merge-multiple: true

      - name: Publish assets and release notes together
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          node scripts/extract-changelog.js "$TAG" > "$RUNNER_TEMP/release-notes.md"
          notes=(--generate-notes)
          if [[ -s "$RUNNER_TEMP/release-notes.md" ]]; then
            notes=(--notes-file "$RUNNER_TEMP/release-notes.md")
          fi
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi

          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo "$TAG is already published"
              exit 0
            fi
          else
            gh release create "$TAG" --title "$TAG" --draft --verify-tag "${notes[@]}" "${prerelease[@]}"
          fi
          gh release upload "$TAG" release/assets/* --clobber
          gh release edit "$TAG" --draft=false
